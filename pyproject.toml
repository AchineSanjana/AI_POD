[tool.ruff]
exclude = [
    "notebooks",
    "tmp_eval_check.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# Add the project root to sys.path so `from src.utils.config import ...` works
pythonpath = ["."]
markers = [
    "integration: tests that require external resources (e.g. the raw Telco CSV)",
]

[tool.pyright]
# Tell Pylance/pyright the project root is the import base (not src/)
pythonVersion = "3.11"
venvPath = "."
venv = "venv"
extraPaths = ["."]