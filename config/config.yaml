# Central project configuration.
# Keep secrets out of this file — those live in .env

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"
  telco_raw_file: "telco_customer_churn.csv"
  customers_out: "customers.csv"
  products_out: "products.csv"
  interactions_out: "interactions.csv"

data:
  # ---------------------------------------------------------------------------
  # Interaction-source block: controls how reshape_telco.py builds interactions
  # ---------------------------------------------------------------------------
  interaction_source:
    # All Telco service columns to consider when building the interaction matrix
    service_columns:
      - "PhoneService"
      - "MultipleLines"
      - "InternetService"
      - "OnlineSecurity"
      - "OnlineBackup"
      - "DeviceProtection"
      - "TechSupport"
      - "StreamingTV"
      - "StreamingMovies"
    # Values that mean "subscribed" (count as a positive interaction)
    positive_values: ["Yes", "DSL", "Fiber optic"]
    # Values that mean "not subscribed" — mirrors NEGATIVE_VALUES in reshape_telco.py
    negative_values: ["No", "No internet service", "No phone service"]

  # Customer table feature contract (matches data/processed/customers.csv)
  customer_features:
    - name: gender
      dtype: categorical
      allowed_values: ["Female", "Male"]
    - name: SeniorCitizen
      dtype: numeric
    - name: Partner
      dtype: categorical
      allowed_values: ["Yes", "No"]
    - name: Dependents
      dtype: categorical
      allowed_values: ["Yes", "No"]
    - name: tenure
      dtype: numeric
    - name: Contract
      dtype: categorical
      allowed_values: ["Month-to-month", "One year", "Two year"]
      encoding: one_hot
    - name: PaperlessBilling
      dtype: categorical
      allowed_values: ["Yes", "No"]
    - name: PaymentMethod
      dtype: categorical
    - name: MonthlyCharges
      dtype: numeric
    - name: TotalCharges
      dtype: numeric
    - name: Churn
      dtype: categorical
      allowed_values: ["Yes", "No"]

  # Product table feature contract (matches data/processed/products.csv)
  product_category:
    name: category
    dtype: categorical
    allowed_values: ["Core", "Add-on"]
    encoding: one_hot

# ---------------------------------------------------------------------------
# Tenant configuration section
# ---------------------------------------------------------------------------
tenants:
  telco_default:
    data_source:
      type: csv
      path: data/raw/telco_customer_churn.csv
    customers:
      id_column: customerID          # raw column name before rename
      features:
        - name: gender
          dtype: categorical
          allowed_values: ["Female", "Male"]
        - name: SeniorCitizen
          dtype: numeric
        - name: Partner
          dtype: categorical
          allowed_values: ["Yes", "No"]
        - name: Dependents
          dtype: categorical
          allowed_values: ["Yes", "No"]
        - name: tenure
          dtype: numeric
        - name: Contract
          dtype: categorical
          allowed_values: ["Month-to-month", "One year", "Two year"]
          encoding: one_hot
        - name: PaperlessBilling
          dtype: categorical
          allowed_values: ["Yes", "No"]
        - name: PaymentMethod
          dtype: categorical
        - name: MonthlyCharges
          dtype: numeric
        - name: TotalCharges
          dtype: numeric
        - name: Churn
          dtype: categorical
          allowed_values: ["Yes", "No"]
    products:
      # Telco's product table isn't a flat column in the raw CSV — it's derived from
      # service_columns via interaction_source rules (Step 2.1). Note this explicitly:
      derived_from: interaction_source
      category_column: category
    interactions:
      source: interaction_source     # references the block built in Step 2.1

  fixture_ecommerce:
    data_source:
      type: csv
      path: data/raw/fixture_ecommerce.csv
    customers:
      id_column: user_id
      features:
        - name: signup_days
          dtype: numeric
        - name: monthly_spend
          dtype: numeric
        - name: plan_type
          dtype: categorical
          allowed_values: ["Basic", "Pro", "Enterprise"]
          encoding: one_hot
    products:
      derived_from: interaction_source
      category_column: category
    interactions:
      source: custom_services
      service_columns: ["electronics", "fashion", "home_decor"]
      positive_values: ["Yes"]
      negative_values: ["No"]

# Lightweight tenant authentication mapping (API Key -> tenant_id)
tenants_auth:
  "sk-telco-xxxx": telco_default
  "sk-ecommerce-xxxx": fixture_ecommerce


model:
  content_based:
    similarity_metric: "cosine"
    # Names of customer features used when building content-based profiles.
    # Must be a subset of data.customer_features[*].name.
    features:
      - tenure
      - MonthlyCharges
      - SeniorCitizen
      - Contract
      - PaperlessBilling
      - PaymentMethod
  collaborative_filtering:
    n_factors: 20
    random_state: 42
  hybrid:
    content_weight: 0.5
    collaborative_weight: 0.5
  ranking:
    # Customer-side feature names fed into the ranking model.
    # Must be a subset of data.customer_features[*].name.
    customer_features:
      - tenure
      - MonthlyCharges
      - SeniorCitizen
      - Contract
    # Product-side feature names fed into the ranking model.
    # Must match data.product_category.name or data.product_features[*].name.
    product_features:
      - category
  evaluation:
    k: 5
    test_size: 0.2
    random_state: 42

integrations:
  company_api:
    enabled: false        # flip to true once access is confirmed
    timeout_seconds: 15
  agent:
    enabled: false         # flip to true once integration scope is confirmed
    timeout_seconds: 15

dummyjson:
  enabled_for_practice_only: true
  page_size: 30
