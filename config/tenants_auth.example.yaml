# Example tenant API key authentication mapping.
# Copy this file to `config/tenants_auth.local.yaml` for local development.
# In production (with STORAGE_BACKEND=s3), store this JSON mapping in AWS SSM Parameter Store
# (default parameter: /ai_pod/tenants_auth) or AWS Secrets Manager.
#
# Key schema:
#   <api_key>:
#     tenant_id: <tenant_id>
#     key_type: private | public
#     created_at: ISO-8601 timestamp string
#
# Note:
# - 'private' keys (sk-...) have full API access (onboarding, training, recommendations, tracking).
# - 'public' keys (pk-...) are restricted server-side strictly to POST /v1/track and GET /v1/recommendations.
# - Legacy format (<api_key>: <tenant_id>) is automatically loaded as private keys for backwards compatibility.

tenants_auth:
  sk-telco-placeholder:
    tenant_id: telco_default
    key_type: private
    created_at: "2026-09-30T00:00:00Z"
  pk-telco-placeholder:
    tenant_id: telco_default
    key_type: public
    created_at: "2026-09-30T00:00:00Z"
  sk-ecommerce-placeholder:
    tenant_id: fixture_ecommerce
    key_type: private
    created_at: "2026-09-30T00:00:00Z"
  pk-ecommerce-placeholder:
